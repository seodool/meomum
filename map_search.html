<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MEOMUM - 지도 검색</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    
    </head>
<body>

<div class="app-container">
    <div class="page page-map-search">
        
        <header class="map-page-header">
            <button type="button" class="map-back-btn" onclick="history.back()" aria-label="이전 화면으로">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" /></svg>
            </button>
            <h2 class="map-header-title">예약</h2>
        </header>

        <iframe 
            id="map-iframe"
            class="map-container"
            src="https://maps.google.com/maps?q=강원대학교%20삼척캠퍼스&t=&z=14&ie=UTF8&iwloc=&output=embed"
            width="100%" 
            height="100%" 
            frameborder="0" 
            style="border:0;" 
            allowfullscreen="" 
            aria-hidden="false" 
            tabindex="0"
        ></iframe>

        <div class="map-overlay-content">
            
            <div class="map-info-card">
                <h3 class="card-subtitle-center">원하는 지역을 선택해 보세요</h3>
                
                <article class="card-detail-item">
                    <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800" class="card-detail-img">
                    <div class="card-detail-overlay">
                        <div class="card-detail-text">
                            <span class="card-detail-label">추천</span>
                            <span class="card-detail-title">강원도 삼척 정하동</span>
                        </div>
                    </div>
                </article>
            </div>
        </div>

    </div>
</div>

<!-- 하단 네비게이션 -->
<nav class="bottom-nav">
  <div class="nav-item" onclick="window.location.href='home.html'">
    <img class="home-icon" src="/meomum/assets/navbar/home.svg" />
    <div class="nav-text">홈</div>
  </div>
  <div class="nav-item" onclick="window.location.href='community.html'">
    <img class="community-icon" src="/meomum/assets/navbar/community.svg" />
    <div class="nav-text">커뮤니티</div>
  </div>
  <div class="nav-item active" onclick="window.location.href='reservation.html'">
    <img class="reservation-icon" src="/meomum/assets/navbar/active_reservation.svg" />
    <div class="nav-text">예약</div>
  </div>
  <div class="nav-item" onclick="window.location.href='chat.html'">
    <img class="chat-icon" src="/meomum/assets/navbar/chat.svg" />
    <div class="nav-text">채팅</div>
  </div>
  <div class="nav-item" onclick="window.location.href='more.html'">
    <img class="more-icon" src="/meomum/assets/navbar/more.svg" />
    <div class="nav-text">더보기</div>
  </div>
</nav>

<script src="js/main.js"></script>
</body>
</html>
