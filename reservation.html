<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>MEOMUM - 예약</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-container">

  <div class="page page-reservation">

    <header class="reservation-header-custom">
      <h2>한달살이</h2>
      <div class="header-links">
        <span>예약</span>
        <span>상담사 연결</span>
      </div>
    </header>

    <div class="reservation-hero-card">
      <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800" class="reservation-hero-img" alt="삼척 정하동" />
      <div class="reservation-hero-overlay"></div>
      <div class="reservation-hero-title">삼척 정하동</div>
      <button class="reservation-hero-btn" type="button">둘러보기</button>
    </div>

    <section class="date-chip-row">
      <button class="date-chip">all</button>
      <button class="date-chip">10</button>
      <button class="date-chip active">11</button>
      <button class="date-chip">12</button>
      <button class="date-chip">13</button>
      <button class="date-chip">end</button>
    </section>

    <section class="reservation-card">
      <div class="reservation-card-header">
        <h3>체크리스트</h3>
        <span class="link-sm">전체보기</span>
      </div>
      <ul class="mission-list">
        <li class="mission-item">
          <span>오늘의 미션 선택</span>
          <div class="mission-checkbox done"></div>
        </li>
        <li class="mission-item">
          <span>호수공원 산책하기</span>
          <div class="mission-checkbox"></div>
        </li>
        <li class="mission-item">
          <span>카페에서 독서하기</span>
          <div class="mission-checkbox"></div>
        </li>
        <li class="mission-item">
          <span>간식 재료 사기</span>
          <div class="mission-checkbox"></div>
        </li>
        <li class="mission-item">
          <span>간식 만들기</span>
          <div class="mission-checkbox"></div>
        </li>
      </ul>
    </section>

    <section class="reservation-card">
      <div class="reservation-card-header">
        <h3>오늘의 미션</h3>
        <span class="link-sm">찾아보기</span>
      </div>
      <p class="reservation-subtext">하고 싶은것 하나를 선택하세요</p>

      <button class="mission-main-button primary" type="button">도서관 들려서 책 읽기</button>
      <button class="mission-main-button secondary" type="button">공방가서 아크릴화 그려보기</button>
    </section>

    <section class="reservation-card">
      <div class="reservation-card-header">
        <h3>일기</h3>
      </div>
      <p class="diary-text">오늘 비가 와서 너무 귀찮았지만, 도서관에서 책을...</p>
      <button class="diary-write-btn" type="button">글쓰기</button>
    </section>

    <section class="reservation-card">
      <div class="reservation-card-header">
        <h3>루틴 기록</h3>
        <span class="link-sm">전체보기</span>
      </div>
      <ul class="routine-list">
        <li class="routine-item">07:14 기상</li>
        <li class="routine-item routine-desc">총 수면 6h 45m / 깊은 수면 2h 10m</li>
        <li class="routine-item" style="margin-top:10px;">07:45 아침 명상</li>
        <li class="routine-item routine-desc">호흡 세션 완료</li>
      </ul>
    </section>

    <button class="reservation-cta-btn-large" type="button">
      <span class="cta-title">상담사 연결</span>
      <span class="cta-desc">불안 하거나, 걱정되는 점 및 매니징</span>
    </button>

  </div>

</div>

<!-- 하단 네비게이션 -->
<nav class="bottom-nav">
  <a class="nav-item" href="home.html">
    <img class="home-icon" src="/meomum/assets/navbar/home.svg" />
    <div class="nav-text">홈</div>
  </a>

  <a class="nav-item" href="community.html">
    <img class="community-icon" src="/meomum/assets/navbar/community.svg" />
    <div class="nav-text">커뮤니티</div>
  </a>

  <a class="nav-item active" href="reservation.html">
    <img class="reservation-icon" src="/meomum/assets/navbar/active_reservation.svg" />
    <div class="nav-text">예약</div>
  </a>

  <a class="nav-item" href="chat.html">
    <img class="chat-icon" src="/meomum/assets/navbar/chat.svg" />
    <div class="nav-text">채팅</div>
  </a>

  <a class="nav-item" href="more.html">
    <img class="more-icon" src="/meomum/assets/navbar/more.svg" />
    <div class="nav-text">더보기</div>
  </a>
</nav>

<script src="js/main.js"></script>
</body>
</html>
